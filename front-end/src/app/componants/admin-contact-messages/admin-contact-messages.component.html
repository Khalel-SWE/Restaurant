<div class="container py-5">

  <h1 class="text-center text-white mb-5 fw-bold">
    Admin Contact Messages
  </h1>

  <div
    *ngFor="let message of messages"
    class="card bg-dark text-light border-0 shadow-lg mb-4 rounded-4">

    <div class="card-body p-4">

      <!-- Subject -->
      <div class="mb-4">

        <h3 class="fw-bold text-warning">
          {{ message.subject }}
        </h3>

      </div>

      <!-- User Info -->
      <div class="row mb-4">

        <div class="col-md-4 mb-3">

          <div class="bg-black rounded-3 p-3 h-100">

            <small class="text-secondary">
              Name
            </small>

            <h5 class="mt-2">
              {{ message.name }}
            </h5>

          </div>

        </div>

        <div class="col-md-4 mb-3">

          <div class="bg-black rounded-3 p-3 h-100">

            <small class="text-secondary">
              Email
            </small>

            <h6 class="mt-2">
              {{ message.email }}
            </h6>

          </div>

        </div>

        <div class="col-md-4 mb-3">

          <div class="bg-black rounded-3 p-3 h-100">

            <small class="text-secondary">
              Username
            </small>

            <h5 class="mt-2">
              {{ message.username }}
            </h5>

          </div>

        </div>

      </div>

      <!-- User Message -->
      <div class="mb-4">

        <h5 class="fw-bold mb-3 text-info">
          User Message
        </h5>

        <div class="bg-secondary bg-opacity-25 rounded-3 p-3">

          {{ message.message }}

        </div>

      </div>

      <!-- Reply -->
      <div class="mb-4">

        <h5 class="fw-bold mb-3 text-success">
          Admin Reply
        </h5>

        <textarea
          class="form-control bg-dark text-light border-secondary"
          rows="5"
          [(ngModel)]="message.reply">
        </textarea>

      </div>

      <!-- Button -->
      <div class="d-grid">

        <button
          class="btn btn-warning fw-bold py-2"
          (click)="sendReply(message)">

          SEND REPLY

        </button>

      </div>

    </div>

  </div>

</div>
