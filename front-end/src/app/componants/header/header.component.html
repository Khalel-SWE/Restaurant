        <div class="nav-item dropdown" *ngIf="isUserLogin()">
          <a
            href="#"
            class="nav-link dropdown-toggle fw-bold"
            data-bs-toggle="dropdown"
          >
            <i class="fa fa-user-circle me-2"></i>

            {{ isAdmin() ? "Admin Panel" : "My Account" }}
          </a>

          <div
            class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 p-3 animate__animated animate__fadeIn"
            style="
              min-width: 260px;
              background: #0f172b;
              border: 1px solid rgba(255, 255, 255, 0.08);
            "
          >
            <!-- USER -->

            <ng-container *ngIf="!isAdmin()">
              <a
                routerLink="/orders-user"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-box-open text-warning me-3"></i>
                My Orders
              </a>

              <a
                routerLink="/profile"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-user-edit text-info me-3"></i>
                Edit Profile
              </a>

              <a
                routerLink="/my-messages"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-comments text-success me-3"></i>
                My Messages
              </a>

              <a
                routerLink="/contact-info"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-envelope text-primary me-3"></i>
                Contact
              </a>

              <a
                routerLink="/chefs"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-users text-danger me-3"></i>
                Team
              </a>
            </ng-container>

            <!-- ADMIN -->

            <ng-container *ngIf="isAdmin()">
              <a
                routerLink="/admin-all-orders"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-box-open text-warning me-3"></i>
                All Orders
              </a>

              <button
                *ngIf="isProductsPage()"
                type="button"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2 border-0 bg-transparent"
                data-bs-toggle="modal"
                data-bs-target="#addProductModal"
              >
                <i class="fa fa-plus text-success me-3"></i>
                Add Product
              </button>

              <a
                routerLink="/admin-users"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-users text-info me-3"></i>
                All Users
              </a>

              <a
                routerLink="/admin-contact-messages"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-envelope text-danger me-3"></i>
                Contact Messages
              </a>
            </ng-container>

            <!-- LINE -->

            <div

                height: 1px;
                background: rgba(255, 255, 255, 0.08);
                margin: 10px 0;
              "
            ></div>

            <!-- LOGOUT -->

            <a
              href=""
              (click)="logOut()"
              class="dropdown-item d-flex align-items-center rounded-3 py-3 text-danger"

              Logout
