<div class="container-xxl position-relative p-0">
  <nav
    class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0"
  >
    <a routerLink="/products" class="navbar-brand p-0">
      <h1 class="text-primary m-0">
        <i class="fa fa-utensils me-3"></i>Restoran
      </h1>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarCollapse"
    >
      <span class="fa fa-bars"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      <input
        *ngIf="isUserLogin()"
        #key
        class="form-control search-input"
        type="search"
        placeholder="Search"
        aria-label="Search"
        (input)="search(key.value)"
      />
      <div class="navbar-nav ms-auto py-0 pe-4">
        <div
          *ngIf="!isUserLogin() && !isLoginPage()"
          class="nav-item nav-link active"
        >
          <a routerLink="/login">Login</a>
        </div>

        <div
          *ngIf="!isUserLogin() && !isSignupPage()"
          class="nav-item nav-link active"
        >
          <a routerLink="/signup">Signup</a>
        </div>
        <div *ngIf="isUserLogin()" class="nav-item nav-link active"></div>
        <div class="nav-item nav-link active"></div>
        <div class="nav-item dropdown" *ngIf="isUserLogin()">
          <a
            href="#"
            class="nav-link dropdown-toggle fw-bold"
            data-bs-toggle="dropdown"
          >
            <i class="fa fa-user-circle me-2"></i>

            {{ isAdmin() ? "Admin Panel" : "My Account" }}
          </a>

          <div
            class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 p-3 animate__animated animate__fadeIn"
            style="
              min-width: 260px;
              background: #0f172b;
              border: 1px solid rgba(255, 255, 255, 0.08);
            "
          >
            <ng-container *ngIf="!isAdmin()">
              <a
                routerLink="/orders-user"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-box-open text-warning me-3"></i>
                My Orders
              </a>

              <a
                routerLink="/profile"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-user-edit text-info me-3"></i>
                Edit Profile
              </a>

              <a
                routerLink="/my-messages"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-comments text-success me-3"></i>
                My Messages
              </a>

              <a
                routerLink="/contact-info"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-envelope text-primary me-3"></i>
                Contact
              </a>

              <a
                routerLink="/chefs"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-users text-danger me-3"></i>
                Team
              </a>
            </ng-container>

            <ng-container *ngIf="isAdmin()">
              <a
                routerLink="/admin-all-orders"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-box-open text-warning me-3"></i>
                All Orders
              </a>

              <button
                *ngIf="isProductsPage()"
                type="button"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2 border-0 bg-transparent"
                (click)="openAddProductModal()"
              >
                <i class="fa fa-plus text-success me-3"></i>
                Add Product
              </button>

              <a
                routerLink="/admin-users"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-users text-info me-3"></i>
                All Users
              </a>

              <a
                routerLink="/admin-contact-messages"
                class="dropdown-item d-flex align-items-center rounded-3 py-3 mb-2"
              >
                <i class="fa fa-envelope text-danger me-3"></i>
                Contact Messages
              </a>
            </ng-container>

            <div
              style="
                height: 1px;
                background: rgba(255, 255, 255, 0.08);
                margin: 10px 0;
              "
            ></div>

            <a
              href=""
              (click)="logOut()"
              class="dropdown-item d-flex align-items-center rounded-3 py-3 text-danger"
            >
              <i class="fa fa-sign-out-alt me-3"></i>
              Logout
            </a>
          </div>
        </div>
      </div>
    </div>
    <app-card *ngIf="isUserLogin() && !isAdmin()"></app-card>
    <app-notification *ngIf="isUserLogin()"></app-notification>
  </nav>

  <div class="container-xxl py-5 bg-dark hero-header mb-5"></div>
</div>
