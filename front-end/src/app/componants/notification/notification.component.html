<div class="dropdown notification-wrapper">
  <button
    (click)="loadNotifications()"
    class="btn notification-btn position-relative"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <i class="fa fa-bell bell-icon"></i>

    <span *ngIf="unreadCount > 0" class="notification-badge">
      {{ unreadCount }}
    </span>
  </button>

  <ul
    class="dropdown-menu dropdown-menu-end notification-menu shadow-lg border-0"
  >
    <!-- HEADER -->
    <li class="notification-header">
      <div class="d-flex justify-content-between align-items-center">
        <span>
          <i class="fa fa-bell text-warning me-2"></i>
          Notifications
        </span>

        <span class="notification-count">
          {{ notifications.length }}
        </span>
      </div>
    </li>

    <!-- EMPTY -->
    <li *ngIf="notifications.length === 0">
      <div class="empty-notification">
        <i class="fa fa-bell-slash mb-2"></i>

        <p class="mb-0">No notifications yet</p>
      </div>
    </li>

    <!-- NOTIFICATIONS -->
    <li *ngFor="let n of notifications">
      <div class="notification-item">
        <div class="notification-icon">
          <!-- ADMIN REPLY -->
          <i
            *ngIf="n.message.includes('reply')"
            class="fa fa-reply text-info"
          ></i>

          <!-- NEW ORDER -->
          <i
            *ngIf="n.message.includes('order')"
            class="fa fa-shopping-bag text-warning"
          ></i>

          <!-- ORDER STATUS -->
          <i
            *ngIf="n.message.includes('status')"
            class="fa fa-truck text-primary"
          ></i>

          <!-- NEW PRODUCT -->
          <i
            *ngIf="n.message.includes('product')"
            class="fa fa-gift text-success"
          ></i>

          <!-- MESSAGE -->
          <i
            *ngIf="n.message.includes('message')"
            class="fa fa-envelope text-danger"
          ></i>

          <!-- DEFAULT -->
          <i
            *ngIf="
              !n.message.includes('reply') &&
              !n.message.includes('order') &&
              !n.message.includes('status') &&
              !n.message.includes('product') &&
              !n.message.includes('message')
            "
            class="fa fa-bell text-secondary"
          ></i>
        </div>

        <div class="notification-content">
          <div class="notification-message">
            {{ n.message }}
          </div>

          <small class="notification-time">
            <i class="fa fa-clock me-1"></i>
            {{ n.createdAt | date: "medium" }}
          </small>
        </div>
      </div>
    </li>
  </ul>
</div>
